[project]
name = "agentp"
version = "0.1.0"
description = "AGENT-P backend: API, orchestrator worker, and execution event log"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "defusedxml>=0.7.1",
    "docker>=7.2.0",
    "fastapi>=0.162.0",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "sse-starlette>=3.6.0",
    "structlog>=26.1.0",
    "uuid-utils>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentp = "app.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "types-defusedxml>=0.7.0.20260504",
    "types-docker>=7.2.0.20261006",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"tests/**" = ["S105", "S106", "ASYNC109", "ASYNC110", "E501"]  # fixtures hold long literal strings
"app/agents/definitions.py" = ["E501"]  # prompt prose

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["sandbox: runs real sandbox containers (needs Docker engine + sandbox image)"]
