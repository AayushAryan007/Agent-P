# Local development stack (runs on Colima — see docs/LOCAL_DEVELOPMENT.md).
#   docker compose up -d postgres        # just the database, run the API with uv on the host
#   docker compose up -d --build         # database + API in containers
name: agentp

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentp
      POSTGRES_PASSWORD: agentp
      POSTGRES_DB: agentp
    ports:
      # 5433 on the host avoids clashing with a Homebrew PostgreSQL on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentp -d agentp"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    command: ["sh", "-c", "alembic upgrade head && agentp api --host 0.0.0.0 --port 8000"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://agentp:agentp@postgres:5432/agentp
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
